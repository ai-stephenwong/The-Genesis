<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Portal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e1e4e8; display: flex; height: 100vh; overflow: hidden; }

  /* Sidebar */
  nav { width: 220px; min-width: 220px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
  nav .brand { padding: 14px 16px 20px; font-size: 15px; font-weight: 600; color: #58a6ff; border-bottom: 1px solid #30363d; }
  nav .section-label { padding: 14px 16px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #8b949e; }
  nav a { display: flex; align-items: center; gap: 10px; padding: 9px 16px; color: #c9d1d9; text-decoration: none; font-size: 13px; transition: background 0.15s; cursor: pointer; border-left: 3px solid transparent; }
  nav a:hover { background: #1f2937; color: #fff; }
  nav a.active { background: #1f2937; color: #58a6ff; border-left-color: #58a6ff; }
  nav a svg { width: 18px; height: 18px; flex-shrink: 0; }
  nav .spacer { flex: 1; }
  nav .nav-footer { padding: 12px 16px; border-top: 1px solid #30363d; font-size: 11px; color: #484f58; }
  nav .open-ext { font-size: 11px; color: #484f58; margin-left: auto; opacity: 0; transition: opacity 0.15s; }
  nav a:hover .open-ext { opacity: 1; }

  /* Main content */
  .content { flex: 1; display: flex; flex-direction: column; height: 100vh; }
  .toolbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #161b22; border-bottom: 1px solid #30363d; min-height: 42px; }
  .toolbar .current-url { flex: 1; font-size: 12px; color: #8b949e; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 4px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolbar button { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 4px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }
  .toolbar button:hover { background: #30363d; }

  iframe { flex: 1; border: none; background: #fff; }

  /* Welcome screen */
  .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .welcome h1 { font-size: 24px; color: #e1e4e8; }
  .welcome p { color: #8b949e; font-size: 14px; }
  .welcome.hidden { display: none; }
  iframe.hidden { display: none; }
</style>
</head>
<body>

<nav>
  <div class="brand">Project Portal</div>

  <div class="section-label">Services</div>

  <a data-url="https://github.com" onclick="loadService(this)">

    GitHub

  </a>

    Doppler

  </a>

  <a data-url="https://vercel.com/dashboard" onclick="loadService(this)">
    <svg viewBox="0 0 24 24" fill="#c9d1d9"><path d="M12 1L24 22H0L12 1z"/></svg>
    Vercel

    Cloudflare
    <span class="open-ext">&#x2197;</span>
  </a>

  <a data-url="https://railway.com/dashboard" onclick="loadService(this)">
    <svg viewBox="0 0 24 24" fill="#c9d1d9"><path d="M.113 14.725c.013.04.026.078.04.117l7.477-5.87a.563.563 0 0 1 .695 0l7.477 5.87c.014-.039.027-.078.04-.117L8.325 8.855a.563.563 0 0 0-.695 0L.113 14.725zM2.06 18.643c.038.055.077.11.118.163l5.8-4.553a.563.563 0 0 1 .695 0l5.8 4.553c.04-.053.08-.108.118-.163L8.325 13.59a.563.563 0 0 0-.695 0L2.06 18.643zM5.684 21.67c.072.05.146.098.221.144l1.952-1.533a.563.563 0 0 1 .695 0l1.952 1.533c.075-.046.15-.094.221-.144L8.325 19.86a.563.563 0 0 0-.695 0L5.684 21.67zM8.325 3.727a.563.563 0 0 0-.695 0L.048 10.34c0 .047 0 .094.003.141l7.93-6.226a.563.563 0 0 1 .695 0l7.93 6.226c.002-.047.003-.094.003-.141L8.325 3.727z"/></svg>
    Railway
    <span class="open-ext">&#x2197;</span>
  </a>

  <a data-url="https://resend.com" onclick="loadService(this)">

    Resend
    <span class="open-ext">&#x2197;</span>
  </a>

  <a data-url="https://console.neon.tech" onclick="loadService(this)">
    <svg viewBox="0 0 24 24" fill="#c9d1d9"><path d="M3 4.5A1.5 1.5 0 0 1 4.5 3h15A1.5 1.5 0 0 1 21 4.5v15a1.5 1.5 0 0 1-1.5 1.5H18v-7.5L12 18l-6-4.5V21H4.5A1.5 1.5 0 0 1 3 19.5v-15z"/></svg>
    Neon
    <span class="open-ext">&#x2197;</span>
  </a>

  <a data-url="https://console.upstash.com" onclick="loadService(this)">
    <svg viewBox="0 0 24 24" fill="#c9d1d9"><path d="M12 2C6.48 2 2 6 2 10.5c0 3 2 5.5 5 7v4.5l3-2.5h2c5.52 0 10-4 10-8.5S17.52 2 12 2zm0 15h-2.5L7 19v-3.1C4.61 14.42 3 12.54 3 10.5 3 6.91 7.03 4 12 4s9 2.91 9 6.5S16.97 17 12 17z"/></svg>
    Upstash
    <span class="open-ext">&#x2197;</span>
  </a>

  <a data-url="https://tagmanager.google.com" onclick="loadService(this)">
    <svg viewBox="0 0 24 24" fill="#c9d1d9"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    GTM
    <span class="open-ext">&#x2197;</span>
  </a>

  <div class="section-label">Monitoring</div>

  <a data-url="https://sentry.io" onclick="loadService(this)">
    <svg viewBox="0 0 24 24" fill="#c9d1d9"><path d="M13.91 2.33a1.64 1.64 0 0 0-2.82 0L8.37 7.6a10.94 10.94 0 0 1 5.47 5.48h3.46a.82.82 0 0 0 .7-1.23l-4.09-9.52zM5.37 14.21a.82.82 0 0 0-.7 1.23l2.36 5.5a1.64 1.64 0 0 0 2.82 0l1.17-2.72a7.85 7.85 0 0 0-5.65-4.01zm12.76 4.59h-2.64a5.7 5.7 0 0 0-5.7-5.7V10.5a8.3 8.3 0 0 1 8.34 8.3z"/></svg>
    Sentry
    <span class="open-ext">&#x2197;</span>
  </a>

  <div class="spacer"></div>
  <div class="nav-footer">Click a service to load it here.<br>Hover &#x2197; to open in new tab.</div>
</nav>

<div class="content">
  <div class="toolbar">
    <span class="current-url" id="currentUrl">No service loaded</span>
    <button onclick="openExternal()">Open in browser</button>
    <button onclick="refreshFrame()">Reload</button>
  </div>

  <div class="welcome" id="welcome">
    <h1>Project Portal</h1>
    <p>Select a service from the sidebar to get started.</p>
  </div>

  <iframe id="serviceFrame" class="hidden" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe>
</div>

<script>
  let currentUrl = '';

  function loadService(el) {
    const url = el.dataset.url;
    currentUrl = url;

    // Update active state
    document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
    el.classList.add('active');

    // Update toolbar
    document.getElementById('currentUrl').textContent = url;

    // Show iframe, hide welcome
    document.getElementById('welcome').classList.add('hidden');
    const frame = document.getElementById('serviceFrame');
    frame.classList.remove('hidden');
    frame.src = url;
  }

  function openExternal() {
    if (currentUrl) window.open(currentUrl, '_blank');
  }

  function refreshFrame() {
    const frame = document.getElementById('serviceFrame');
    if (frame.src) frame.src = frame.src;
  }

  // Allow hover arrow to open in new tab without loading in iframe
  document.querySelectorAll('.open-ext').forEach(span => {
    span.addEventListener('click', (e) => {
      e.stopPropagation();
      const url = span.closest('a').dataset.url;
      window.open(url, '_blank');
    });
  });
</script>

</body>
</html>
